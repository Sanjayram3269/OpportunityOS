services:
  postgres:
    image: postgres:17-alpine
    container_name: opportunityos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opportunityos
      POSTGRES_USER: opportunityos
      POSTGRES_PASSWORD: opportunityos_dev
    ports:
      - "5432:5432"
    volumes:
      - opportunityos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunityos -d opportunityos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opportunityos_postgres_data: